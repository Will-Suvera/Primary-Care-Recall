name: Sync DPA-signed deals to Notion Recall Practices

on:
  # Fired by the HubSpot workflow webhook the moment a deal enters
  # "DPA Signed Onboard Ready" (POST /repos/.../dispatches, event_type dpa_signed)
  repository_dispatch:
    types: [dpa_signed]
  # Primary trigger while no HubSpot webhook is configured (needs Ops Hub):
  # poll every 15 min — free on a public repo, near-real-time in practice
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: notion-recall-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Contracts first: the DocuSign step writes "Contract practices (ODS)" on
      # the deal, which the Notion step then uses to decide which rows to create.
      # continue-on-error so a DocuSign outage/auth problem never blocks Notion.
      - name: Import signed DocuSign contracts
        continue-on-error: true
        env:
          HUBSPOT_API_TOKEN: ${{ secrets.HUBSPOT_API_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          DOCUSIGN_INTEGRATION_KEY: ${{ secrets.DOCUSIGN_INTEGRATION_KEY }}
          DOCUSIGN_USER_ID: ${{ secrets.DOCUSIGN_USER_ID }}
          DOCUSIGN_PRIVATE_KEY: ${{ secrets.DOCUSIGN_PRIVATE_KEY }}
          DOCUSIGN_AUTH_SERVER: ${{ secrets.DOCUSIGN_AUTH_SERVER }}
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
          DRIVE_WEBAPP_URL: ${{ secrets.DRIVE_WEBAPP_URL }}
          DRIVE_WEBAPP_SECRET: ${{ secrets.DRIVE_WEBAPP_SECRET }}
        run: |
          pip install -q cryptography pypdf google-api-python-client google-auth
          python3 pipeline/sync_docusign_contracts.py
      - name: Sync to Notion
        env:
          HUBSPOT_API_TOKEN: ${{ secrets.HUBSPOT_API_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: python3 pipeline/sync_notion_recall_practices.py
