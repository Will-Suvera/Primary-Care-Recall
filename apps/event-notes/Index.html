<style>
  /* Suvera Flow tokens: same values as ops.suvera.com
     (docs/design/suvera-flow.md, apps/primary-care-tech-overview/src/suvera-flow.css). */
  :root {
    color-scheme: light;
    --su-brand: #482190; --su-brand-ink: #FFFFFF; --su-brand-tint: rgba(72, 33, 144, .10);
    --su-brand-muted: #EEECFF; --su-brand-deep: #2E1560;
    --su-paper: #FBFAF8; --su-card: #FFFFFF; --su-surface: #F5F3F0; --su-line: #E2E1DE;
    --su-ink: #0E0D0B; --su-text: #2B2926; --su-muted: #54524F; --su-faint: #8A8579;
    --su-good: #2C522D; --su-good-bg: #E7F2E7; --su-good-line: #BED5BE;
    --su-warn: #7F4413; --su-warn-bg: #FEEADB; --su-warn-line: #EDC5A8;
    --su-bad: #932B2A;  --su-bad-bg: #FCEAE8;  --su-bad-line: #F3BFBA;
    --su-r-card: 14px; --su-r-input: 8px; --su-r-chip: 6px; --su-r-pop: 12px;
    --su-shadow-btn: 0 1px 2px rgba(14, 13, 11, .12);
    --su-shadow-pop: 0 12px 32px -18px rgba(14, 13, 11, .38);
    --su-serif: 'Bitter', Georgia, 'Times New Roman', serif;
    --su-font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--su-paper); color: var(--su-text); }
  body {
    font-family: var(--su-font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); -webkit-text-size-adjust: 100%;
  }
  h1, h2 { font-family: var(--su-serif); font-weight: 500; color: var(--su-ink); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--su-brand); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--su-faint); font-weight: 700; margin: 0; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

  /* Header: paper, logo left, hairline below */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 12px; border-bottom: 1px solid var(--su-line); margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .brand .event { font-family: var(--su-serif); font-weight: 500; color: var(--su-ink); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 10px; border-left: 1px solid var(--su-line); }
  .me { flex: none; display: inline-flex; align-items: center; gap: 6px; background: var(--su-surface); color: var(--su-ink); border: 0; border-radius: var(--su-r-chip); padding: 5px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .me span { color: var(--su-muted); font-weight: 500; }

  /* Inputs (16px+ so iOS doesn't zoom) */
  input, textarea {
    width: 100%; background: var(--su-card); border: 1px solid var(--su-line); border-radius: var(--su-r-input);
    color: var(--su-ink); padding: 13px 14px; font-size: 16px; font-weight: 500; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  input::placeholder, textarea::placeholder { color: var(--su-faint); font-weight: 400; }
  input:focus, textarea:focus { border-color: var(--su-brand); box-shadow: 0 0 0 3px var(--su-brand-tint); }
  .search { position: sticky; top: 0; z-index: 5; background: var(--su-paper); padding: 2px 0 10px; }
  #q { font-size: 17px; padding: 14px 14px; }

  .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  .status.warn { background: var(--su-warn-bg); color: var(--su-warn); border-color: var(--su-warn-line); }
  #queuePill { margin: 0 0 10px; cursor: pointer; }
  .hint { margin: 2px 2px 10px; }

  /* Guest rows: white card, hairline, no shadow */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    background: var(--su-card); border: 1px solid var(--su-line); border-radius: var(--su-r-card); padding: 13px 15px;
  }
  .row:active { background: var(--su-surface); }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; color: var(--su-ink); font-size: 15.5px; }
  .row .sub { color: var(--su-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { flex: none; display: inline-flex; align-items: center; border-radius: var(--su-r-chip); padding: 3px 8px; font-size: 12px; font-weight: 600; background: var(--su-surface); color: var(--su-ink); }
  .chip.brand { background: var(--su-brand-muted); color: var(--su-brand); }
  mark { background: none; color: var(--su-brand); font-weight: 700; }

  .add {
    margin-top: 12px; width: 100%; padding: 14px; border-radius: var(--su-r-card); cursor: pointer;
    border: 1px dashed var(--su-line); background: none; color: var(--su-brand); font-weight: 600; font-size: 14.5px;
  }

  /* Person */
  .back { background: none; border: 0; color: var(--su-brand); padding: 16px 0 8px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .person h1 { font-size: 28px; line-height: 1.15; margin: 4px 0 6px; }
  .person .org { font-size: 15px; color: var(--su-muted); }
  .person .email { font-size: 13px; color: var(--su-faint); margin-top: 2px; word-break: break-all; }
  .fields { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .section { margin: 24px 2px 8px; display: flex; align-items: baseline; gap: 8px; }
  .note { background: var(--su-card); border: 1px solid var(--su-line); border-radius: var(--su-r-card); padding: 12px 15px; margin-bottom: 8px; }
  .note .meta { font-size: 12.5px; color: var(--su-faint); margin-bottom: 4px; }
  .note .meta b { color: var(--su-ink); font-weight: 600; }
  .note .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 6px; }
  .note .body { white-space: pre-wrap; word-wrap: break-word; color: var(--su-text); }
  .note.pending { border-style: dashed; }

  textarea { min-height: 128px; resize: vertical; line-height: 1.5; font-weight: 400; color: var(--su-text); }
  .tagbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .tag {
    border: 1px solid var(--su-line); background: var(--su-card); color: var(--su-ink); border-radius: 999px;
    padding: 8px 13px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .tag[aria-pressed="true"] { background: var(--su-brand); color: var(--su-brand-ink); border-color: var(--su-brand); }

  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; cursor: pointer;
    background: var(--su-brand); color: var(--su-brand-ink); border: 1px solid var(--su-brand);
    border-radius: var(--su-r-input); padding: 15px 18px; font-size: 16px; font-weight: 600; box-shadow: var(--su-shadow-btn);
  }
  .btn:active { background: var(--su-brand-deep); border-color: var(--su-brand-deep); }
  .btn:disabled { opacity: .45; cursor: default; }
  #save { margin-top: 16px; }

  /* Setup: centred panel, logo, Bitter H1 */
  .setup { padding-top: 32px; }
  .panel { background: var(--su-card); border: 1px solid var(--su-line); border-radius: var(--su-r-card); padding: 26px 22px; }
  .panel .logo { width: 110px; height: 26px; margin-bottom: 22px; }
  .panel h1 { font-size: 28px; margin-bottom: 6px; }
  .panel p { color: var(--su-muted); margin: 0 0 20px; }
  .team { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .team button {
    background: var(--su-card); color: var(--su-ink); border: 1px solid var(--su-line); border-radius: var(--su-r-input);
    padding: 12px 6px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .team button[aria-pressed="true"] { background: var(--su-brand); color: var(--su-brand-ink); border-color: var(--su-brand); }
  #pinInput { margin: 4px 0 14px; }
  .err { color: var(--su-bad); font-size: 14px; margin-top: 10px; min-height: 1em; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(16px);
    background: var(--su-card); color: var(--su-ink); border: 1px solid var(--su-line); border-radius: var(--su-r-pop);
    box-shadow: var(--su-shadow-pop); padding: 11px 18px; font-weight: 600; font-size: 14.5px;
    opacity: 0; transition: .2s ease; pointer-events: none; z-index: 20; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading { text-align: center; color: var(--su-muted); padding: 80px 0; }
  .loading .logo { width: 110px; height: 26px; margin: 0 auto 16px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="loading"><i class="logo" role="img" aria-label="Suvera"></i>Loading…</div>

  <!-- First run: who are you? -->
  <section id="setup" class="setup" hidden>
    <div class="panel">
      <i class="logo" role="img" aria-label="Suvera"></i>
      <h1>Who are you?</h1>
      <p>Your name goes on every note you save. You only do this once.</p>
      <div id="teamButtons" class="team"></div>
      <input id="meInput" placeholder="Your name" autocomplete="name" style="margin-bottom:14px" hidden>
      <input id="pinInput" placeholder="Team PIN" inputmode="numeric" autocomplete="off" hidden>
      <button id="start" class="btn">Start</button>
      <div id="setupErr" class="err"></div>
    </div>
  </section>

  <!-- Search -->
  <section id="home" hidden>
    <header>
      <div class="brand"><i class="logo" role="img" aria-label="Suvera"></i><div class="event" id="eventName"></div></div>
      <button class="me" id="changeMe"><span>You</span> <b id="meName"></b></button>
    </header>
    <div class="search">
      <input id="q" type="search" placeholder="Search name or practice" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
    <button id="queuePill" class="status warn" hidden></button>
    <p id="hint" class="hint eyebrow num"></p>
    <div id="results" class="list"></div>
    <button id="addNew" class="add">+ Add someone not on the list</button>
  </section>

  <!-- Person + note -->
  <section id="person" class="person" hidden>
    <button class="back" id="back">‹ Back</button>
    <div id="personHead"></div>
    <div id="walkinFields" class="fields" hidden>
      <input id="wName" placeholder="Full name *" autocomplete="off" autocapitalize="words">
      <input id="wOrg" placeholder="Practice / organisation" autocomplete="off" autocapitalize="words">
      <input id="wRole" placeholder="Role (optional)" autocomplete="off" autocapitalize="sentences">
      <input id="wEmail" placeholder="Email (optional)" type="email" autocomplete="off" autocapitalize="off">
    </div>
    <div id="teamNotesWrap" hidden>
      <div class="section"><p class="eyebrow num" id="teamNotesTitle"></p></div>
      <div id="teamNotes"></div>
    </div>
    <div class="section"><p class="eyebrow">Your note</p></div>
    <textarea id="note" placeholder="e.g. Interested in recall automation. Wants a demo in January."></textarea>
    <div id="chips" class="tagbar"></div>
    <button id="save" class="btn" disabled>Save</button>
  </section>

</div>
<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  /* ---------- tiny utilities ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('sen:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('sen:' + k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem('sen:' + k); } catch (e) {} }
  };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9@.]+/g, ' ').trim();
  }
  function guestKey(email, name) {
    if (email) return String(email).toLowerCase();
    return 'name:' + String(name || '').toLowerCase().normalize('NFD')
      .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function uid() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }
  function errMsg(e) { return String((e && e.message) || e || ''); }
  function fmtTime(ms) {
    if (!ms) return '';
    var d = new Date(ms), now = new Date();
    var t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return t;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + t;
  }
  var toastTimer;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }
  function show(id) {
    ['loading', 'setup', 'home', 'person'].forEach(function (s) { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }

  /* ---------- state ---------- */
  var S = {
    config: null,
    me: store.get('me', ''),
    pin: store.get('pin', ''),
    guests: [],
    notes: [],
    queue: store.get('queue', []),   // notes not yet confirmed by the sheet
    current: null,                   // guest being viewed (null + walkin flag for new)
    isNew: false,
    tags: [],
    flushing: false
  };

  /* ---------- data ---------- */
  function indexGuest(g) {
    g._n = norm(g.name);
    g._nw = g._n.split(' ');
    g._o = norm(g.practice);
    g._ow = g._o.split(' ');
    g._hay = [g._n, g._o, norm(g.role), norm(g.email)].join(' ');
    return g;
  }

  function allNotes() {
    var seen = {};
    S.notes.forEach(function (n) { if (n.entryId) seen[n.entryId] = 1; });
    var pending = S.queue.filter(function (q) { return !seen[q.entryId]; }).map(function (q) {
      return { ts: q.clientTs, team: q.team, name: q.name, email: q.email, practice: q.practice,
        role: q.role, tags: q.tags.join(', '), note: q.note, key: q.key, entryId: q.entryId, pending: true };
    });
    return S.notes.concat(pending);
  }

  function notesFor(key) {
    return allNotes().filter(function (n) { return n.key === key; })
      .sort(function (a, b) { return b.ts - a.ts; });
  }

  function guestList() {
    // Server guests + any walk-ins still sitting in our local queue.
    var map = {}, out = [];
    S.guests.forEach(function (g) { map[g.key] = 1; out.push(g); });
    S.queue.forEach(function (q) {
      if (!map[q.key]) {
        map[q.key] = 1;
        out.push(indexGuest({ key: q.key, name: q.name, email: q.email, practice: q.practice, role: q.role, walkin: true }));
      }
    });
    return out;
  }

  function refresh() {
    return call('getData', S.pin).then(function (d) {
      S.guests = d.guests.map(indexGuest);
      S.notes = d.notes;
      store.set('cache', { guests: d.guests, notes: d.notes });
      if (!$('home').hidden) renderResults();
      if (!$('person').hidden && S.current && !S.isNew) renderTeamNotes();
    }).catch(function (e) {
      if (errMsg(e).indexOf('PIN_INVALID') !== -1) { store.del('pin'); S.pin = ''; renderSetup('PIN changed. Enter the new team PIN.'); }
    });
  }

  /* ---------- offline-safe save queue ---------- */
  function persistQueue() { store.set('queue', S.queue); renderQueuePill(); }

  function flush() {
    if (S.flushing || !S.queue.length) return Promise.resolve();
    S.flushing = true;
    var items = S.queue.slice();
    var chain = Promise.resolve();
    var pinBad = false;
    items.forEach(function (item) {
      chain = chain.then(function () {
        if (pinBad) return;
        return call('saveNote', S.pin, item).then(function () {
          S.queue = S.queue.filter(function (q) { return q.entryId !== item.entryId; });
          persistQueue();
        }).catch(function (e) {
          if (errMsg(e).indexOf('PIN_INVALID') !== -1) pinBad = true;
          // Anything else (no signal, timeout): keep it and retry later.
        });
      });
    });
    return chain.then(function () {
      S.flushing = false;
      if (pinBad) { store.del('pin'); S.pin = ''; renderSetup('PIN changed. Enter the new team PIN. Your notes are kept.'); return; }
      var tried = {};
      items.forEach(function (i) { tried[i.entryId] = 1; });
      // A note saved while we were sending: send it now rather than in 30s.
      if (S.queue.some(function (q) { return !tried[q.entryId]; })) return flush();
      return refresh();
    });
  }

  function sync() { return S.queue.length ? flush() : refresh(); }

  function renderQueuePill() {
    var n = S.queue.length, el = $('queuePill');
    el.hidden = !n;
    el.textContent = (n === 1 ? '1 note' : n + ' notes') + ' waiting for signal · tap to retry';
  }

  /* ---------- setup screen ---------- */
  var pickedMe = '';
  function renderSetup(err) {
    show('setup');
    var team = (S.config && S.config.team) || [];
    pickedMe = S.me;
    $('teamButtons').innerHTML = team.map(function (t) {
      return '<button data-name="' + esc(t) + '" aria-pressed="' + (t === S.me) + '">' + esc(t) + '</button>';
    }).join('');
    $('teamButtons').hidden = !team.length;
    $('meInput').hidden = !!team.length;
    $('meInput').value = S.me;
    $('pinInput').hidden = !(S.config && S.config.pinRequired);
    $('pinInput').value = S.pin;
    $('setupErr').textContent = err || '';
  }
  $('teamButtons').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    pickedMe = b.getAttribute('data-name');
    Array.prototype.forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); });
  });
  $('start').addEventListener('click', function () {
    var team = (S.config && S.config.team) || [];
    var me = team.length ? pickedMe : $('meInput').value.trim();
    var pin = $('pinInput').value.trim();
    if (!me) { $('setupErr').textContent = team.length ? 'Tap your name.' : 'Enter your name.'; return; }
    if (S.config.pinRequired && !pin) { $('setupErr').textContent = 'Enter the team PIN.'; return; }
    $('start').disabled = true;
    $('setupErr').textContent = '';
    call('getData', pin).then(function (d) {
      S.me = me; S.pin = pin;
      store.set('me', me); store.set('pin', pin);
      S.guests = d.guests.map(indexGuest); S.notes = d.notes;
      store.set('cache', { guests: d.guests, notes: d.notes });
      goHome();
      sync();
    }).catch(function (e) {
      $('setupErr').textContent = errMsg(e).indexOf('PIN_INVALID') !== -1 ? 'Wrong PIN.' : 'No connection. Try again.';
    }).then(function () { $('start').disabled = false; });
  });

  /* ---------- home / search ---------- */
  function goHome() {
    S.current = null; S.isNew = false;
    show('home');
    $('eventName').textContent = (S.config && S.config.eventName) || 'Event notes';
    $('meName').textContent = S.me;
    renderQueuePill();
    renderResults();
  }

  function score(g, tokens) {
    var total = 0;
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i], s = 0;
      if (g._nw.some(function (w) { return w.indexOf(t) === 0; })) s = 4;
      else if (g._n.indexOf(t) !== -1) s = 2.5;
      else if (g._ow.some(function (w) { return w.indexOf(t) === 0; })) s = 2;
      else if (g._hay.indexOf(t) !== -1) s = 1;
      else return 0;
      total += s;
    }
    if (g._n.indexOf(tokens.join(' ')) === 0) total += 3;
    return total;
  }

  function highlight(text, tokens) {
    var safe = esc(text);
    if (!tokens.length) return safe;
    // Highlight word starts that match a token (accent-insensitive match on the plain text).
    var words = String(text).split(/(\s+)/);
    return words.map(function (w) {
      var nw = norm(w);
      var hit = tokens.some(function (t) { return nw && nw.indexOf(t) === 0; });
      return hit ? '<mark>' + esc(w) + '</mark>' : esc(w);
    }).join('');
  }

  function renderResults() {
    var q = norm($('q').value);
    var tokens = q ? q.split(' ') : [];
    var list = guestList();
    var counts = {};
    allNotes().forEach(function (n) { counts[n.key] = (counts[n.key] || 0) + 1; });

    var rows;
    if (tokens.length) {
      rows = list.map(function (g) { return { g: g, s: score(g, tokens) }; })
        .filter(function (x) { return x.s > 0; })
        .sort(function (a, b) { return b.s - a.s || a.g.name.localeCompare(b.g.name); })
        .map(function (x) { return x.g; });
    } else {
      rows = list.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    }

    var spoken = Object.keys(counts).length;
    $('hint').textContent = tokens.length
      ? (rows.length ? rows.length + ' match' + (rows.length === 1 ? '' : 'es') : 'No one found. Add them below.')
      : list.length + ' guests · ' + spoken + ' spoken to';

    $('results').innerHTML = rows.slice(0, 60).map(function (g) {
      var c = counts[g.key] || 0;
      var sub = [g.practice, g.role].filter(Boolean).join(' · ');
      var badge = c ? '<span class="chip brand num">' + c + ' note' + (c === 1 ? '' : 's') + '</span>'
        : (g.walkin ? '<span class="chip">Walk-in</span>' : '');
      return '<button class="row" data-key="' + esc(g.key) + '"><div class="main"><div class="name">' +
        highlight(g.name, tokens) + '</div><div class="sub">' + highlight(sub, tokens) + '</div></div>' + badge + '</button>';
    }).join('');
    $('addNew').textContent = tokens.length ? '+ Add "' + $('q').value.trim() + '" as a new person' : '+ Add someone not on the list';
  }

  $('q').addEventListener('input', renderResults);
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = $('results').querySelector('.row'); if (first) first.click(); }
  });
  $('results').addEventListener('click', function (e) {
    var b = e.target.closest('.row'); if (!b) return;
    var key = b.getAttribute('data-key');
    var g = guestList().filter(function (x) { return x.key === key; })[0];
    if (g) openPerson(g, false);
  });
  $('addNew').addEventListener('click', function () { openPerson(null, true); });
  $('changeMe').addEventListener('click', function () { renderSetup(); });
  $('queuePill').addEventListener('click', function () { flush(); toast('Retrying…'); });

  /* ---------- person / note ---------- */
  function draftKey() { return 'draft:' + (S.isNew ? '__new__' : S.current.key); }

  function openPerson(g, isNew) {
    S.current = g; S.isNew = isNew;
    show('person');
    var draft = store.get(draftKey(), null) || { note: '', tags: [] };
    S.tags = draft.tags || [];
    $('note').value = draft.note || '';
    $('walkinFields').hidden = !isNew;
    if (isNew) {
      $('personHead').innerHTML = '<h1>New person</h1>';
      var typed = $('q').value.trim();
      $('wName').value = draft.wName || (/@/.test(typed) ? '' : typed);
      $('wOrg').value = draft.wOrg || '';
      $('wRole').value = draft.wRole || '';
      $('wEmail').value = draft.wEmail || (/@/.test(typed) ? typed : '');
      $('teamNotesWrap').hidden = true;
    } else {
      $('personHead').innerHTML =
        '<h1>' + esc(g.name) + '</h1>' +
        '<div class="org">' + esc([g.practice, g.role].filter(Boolean).join(' · ')) + '</div>' +
        (g.email ? '<div class="email">' + esc(g.email) + '</div>' : '');
      renderTeamNotes();
    }
    renderChips();
    updateSaveState();
    var hasNotes = !isNew && notesFor(g.key).length > 0;
    // Jump straight to typing unless there are colleague notes to read first.
    if (isNew) $('wName').focus();
    else if (!hasNotes) $('note').focus();
  }

  function renderTeamNotes() {
    var list = notesFor(S.current.key);
    $('teamNotesWrap').hidden = !list.length;
    $('teamNotesTitle').textContent = 'Already spoken to · ' + list.length;
    $('teamNotes').innerHTML = list.map(function (n) {
      return '<div class="note' + (n.pending ? ' pending' : '') + '"><div class="meta"><b>' + esc(n.team) + '</b> · ' +
        esc(fmtTime(n.ts)) + (n.pending ? ' · sending…' : '') + '</div>' +
        (n.tags ? '<div class="tags">' + n.tags.split(/,\s*/).filter(Boolean).map(function (t) { return '<span class="chip brand">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
        (n.note ? '<div class="body">' + esc(n.note) + '</div>' : '') + '</div>';
    }).join('');
  }

  function renderChips() {
    var tags = (S.config && S.config.quickTags) || [];
    $('chips').innerHTML = tags.map(function (t) {
      return '<button class="tag" data-tag="' + esc(t) + '" aria-pressed="' + (S.tags.indexOf(t) !== -1) + '">' + esc(t) + '</button>';
    }).join('');
  }
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.tag'); if (!b) return;
    var t = b.getAttribute('data-tag');
    var i = S.tags.indexOf(t);
    if (i === -1) S.tags.push(t); else S.tags.splice(i, 1);
    b.setAttribute('aria-pressed', i === -1);
    saveDraft(); updateSaveState();
  });

  function saveDraft() {
    var d = { note: $('note').value, tags: S.tags };
    if (S.isNew) { d.wName = $('wName').value; d.wOrg = $('wOrg').value; d.wRole = $('wRole').value; d.wEmail = $('wEmail').value; }
    store.set(draftKey(), d);
  }
  function updateSaveState() {
    var hasContent = $('note').value.trim() || S.tags.length;
    var hasName = !S.isNew || $('wName').value.trim();
    $('save').disabled = !(hasContent && hasName);
  }
  ['note', 'wName', 'wOrg', 'wRole', 'wEmail'].forEach(function (id) {
    $(id).addEventListener('input', function () { saveDraft(); updateSaveState(); });
  });

  $('back').addEventListener('click', goHome);

  $('save').addEventListener('click', function () {
    if ($('save').disabled) return;
    var g = S.current, item;
    if (S.isNew) {
      var name = $('wName').value.trim();
      var email = $('wEmail').value.trim().toLowerCase();
      item = { name: name, email: email, practice: $('wOrg').value.trim(), role: $('wRole').value.trim(), walkin: true, key: guestKey(email, name) };
    } else {
      item = { name: g.name, email: g.email, practice: g.practice, role: g.role, walkin: !!g.walkin, key: g.key };
    }
    item.team = S.me;
    item.note = $('note').value.trim();
    item.tags = S.tags.slice();
    item.entryId = uid();
    item.clientTs = Date.now();

    S.queue.push(item);
    persistQueue();
    store.del(draftKey());
    $('q').value = '';
    goHome();
    toast('Saved');
    flush();
  });

  /* ---------- background sync ---------- */
  setInterval(function () { if (!document.hidden) sync(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  window.addEventListener('online', function () { flush(); });

  /* ---------- boot ---------- */
  var cache = store.get('cache', null);
  if (cache) { S.guests = cache.guests.map(indexGuest); S.notes = cache.notes; }

  call('getConfig').then(function (cfg) {
    S.config = cfg;
    store.set('config', cfg);
    if (!S.me || (cfg.pinRequired && !S.pin)) return renderSetup();
    goHome();
    sync();
  }).catch(function () {
    // No signal at boot: use what we had last time.
    S.config = store.get('config', null);
    if (S.config && S.me) { goHome(); toast('Offline: showing saved list'); }
    else { $('loading').textContent = 'No connection. Reconnect and reload.'; }
  });
})();
</script>
</body>
</html>
